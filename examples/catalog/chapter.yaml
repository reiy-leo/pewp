# 章节标题：自动拼出「第 N 章：标题」，下面跟一段导语
name: Chapter
description: 章节标题加一段导语
props:
  n: { type: integer, required: true }
  title: { type: string, required: true }
  lead: { type: inline, default: "" }
template:
  root: h
  elements:
    h:
      type: Document
      children: [title, lead]
    title:
      type: Heading
      props: { level: 2, text: "第 {{n}} 章：{{title}}" }
    lead:
      type: Text
      props: { text: "{{lead}}" }
      style: { color: "#666666" }
