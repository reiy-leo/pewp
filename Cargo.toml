[package]
name = "pewp"
version = "0.0.0"
edition = "2024"
description = "One JSON document, rendered through a registered component catalog to docx, pdf and html."
license = "MIT"
repository = "https://github.com/reiy-leo/pewp"
readme = "README.md"
keywords = ["docx", "pdf", "json", "mcp", "document"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
anyhow = "1"
base64 = "0.22"
docx-rs = "0.4.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2"
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-layout = "0.15.1"
typst-kit = { version = "0.15.1", default-features = false, features = ["embedded-fonts", "scan-fonts"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
